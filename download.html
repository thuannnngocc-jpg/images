<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tải Hình Ảnh - Từng Cái</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .image-wrapper {
            margin-bottom: 30px;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            transition: transform 0.3s;
        }
        
        .image-wrapper:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.3);
        }
        
        .image-container {
            width: 100%;
            background: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            max-height: 600px;
        }
        
        .image-container img {
            max-width: 100%;
            max-height: 100%;
            border-radius: 8px;
        }
        
        .image-info {
            padding: 20px;
            background: white;
        }
        
        .image-title {
            font-size: 18px;
            font-weight: 700;
            color: #333;
            margin-bottom: 10px;
            word-break: break-word;
        }
        
        .image-size {
            font-size: 13px;
            color: #999;
            margin-bottom: 15px;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s;
            text-decoration: none;
            text-align: center;
            display: inline-block;
        }
        
        .btn-download {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            flex: 1;
            min-width: 120px;
        }
        
        .btn-download:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        .btn-copy {
            background: #f0f0f0;
            color: #333;
            border: 1px solid #ddd;
        }
        
        .btn-copy:hover {
            background: #e0e0e0;
        }
        
        .btn-view {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffc107;
        }
        
        .btn-view:hover {
            background: #ffe69c;
        }
        
        .copy-feedback {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #28a745;
            color: white;
            padding: 12px 20px;
            border-radius: 6px;
            display: none;
            z-index: 1000;
            animation: slideIn 0.3s ease-out;
        }
        
        @keyframes slideIn {
            from {
                transform: translateX(400px);
            }
            to {
                transform: translateX(0);
            }
        }
        
        .copy-feedback.show {
            display: block;
        }
        
        .stats {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📸 Thư Viện Ảnh - Tải Từng Cái</h1>
        <div class="stats">Tổng cộng: <strong id="total-count">0</strong> hình ảnh</div>
        
        <div id="images-container">
            <!-- Ảnh sẽ được thêm vào đây -->
        </div>
    </div>
    
    <div class="copy-feedback" id="copyFeedback">✓ Đã copy link!</div>
    
    <script>
        const images = [
            { name: 'Messenger_creation_0AFF39E9-ABED-4C49-8484-F282EF8EA027.jpeg', size: '80.8 KB' },
            { name: 'Screenshot_2026-09-10-23-42-15-959_com.zing.zalo-edit.jpg', size: '273.9 KB' },
            { name: 'akaza.jpg', size: '132.8 KB' },
            { name: 'bakugo.jpg', size: '134.7 KB' },
            { name: 'cha tanjiro.jpg', size: '126.6 KB' },
            { name: 'kaizu.jpg', size: '126.0 KB' },
            { name: 'kratos.jpg', size: '123.6 KB' },
            { name: 'luffy ignis.jpg', size: '128.7 KB' },
            { name: 'luffy shirou.jpg', size: '130.1 KB' },
            { name: 'main kaizu.jpg', size: '124.5 KB' },
            { name: 'messi.jpg', size: '126.2 KB' },
            { name: 'nữ kaizu.jpg', size: '130.8 KB' },
            { name: 'sanji.jpg', size: '120.1 KB' },
            { name: 'tanjiro.jpg', size: '134.0 KB' },
            { name: 'thomas.jpg', size: '115.3 KB' },
            { name: 'đại trụ khác.jpg', size: '132.7 KB' },
            { name: 'đội trưởng mỹ.jpg', size: '119.6 KB' }
        ];
        
        const baseRawUrl = 'https://raw.githubusercontent.com/thuannnngocc-jpg/images/main/';
        const container = document.getElementById('images-container');
        
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                const feedback = document.getElementById('copyFeedback');
                feedback.classList.add('show');
                setTimeout(() => {
                    feedback.classList.remove('show');
                }, 2000);
            });
        }
        
        images.forEach(img => {
            const encodedName = encodeURIComponent(img.name);
            const downloadUrl = baseRawUrl + encodedName;
            const viewUrl = `https://github.com/thuannnngocc-jpg/images/blob/main/${encodedName}`;
            
            const wrapper = document.createElement('div');
            wrapper.className = 'image-wrapper';
            wrapper.innerHTML = `
                <div class="image-container">
                    <img src="${downloadUrl}" alt="${img.name}" loading="lazy">
                </div>
                <div class="image-info">
                    <div class="image-title">${img.name}</div>
                    <div class="image-size">${img.size}</div>
                    <div class="button-group">
                        <a href="${downloadUrl}" download class="btn btn-download">⬇️ Tải Ảnh</a>
                        <button onclick="copyToClipboard('${downloadUrl}')" class="btn btn-copy">📋 Copy Link</button>
                        <a href="${viewUrl}" target="_blank" class="btn btn-view">👁️ Xem GitHub</a>
                    </div>
                </div>
            `;
            container.appendChild(wrapper);
        });
        
        document.getElementById('total-count').textContent = images.length;
    </script>
</body>
</html>
